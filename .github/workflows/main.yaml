name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildAllProjects:
        description: Build and publish all NuGet projects
        required: false
        type: boolean
        default: false

jobs:
  build-and-publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    env:
      buildVersion: "4.2"
      projectToPublish: "**/*.csproj"
      runTests: "false"
      nugetFeedUrl: "https://api.nuget.org/v3/index.json"

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x.x'

    - name: Detect Changed NuGet Projects
      id: changed-packages
      shell: pwsh
      env:
        BUILD_ALL_PROJECTS: ${{ inputs.buildAllProjects }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: ./.github/scripts/Detect-ChangedNuGetProjects.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

    - name: Test Workflow Scripts
      shell: pwsh
      run: ./.github/scripts/tests/WorkflowScripts.Tests.ps1

    - name: Configure Project Versions
      shell: pwsh
      env:
        SELECTED_PROJECT_PATHS: ${{ steps.changed-packages.outputs.selected_project_paths }}
      run: ./.github/scripts/New-ProjectVersionProps.ps1 -BaseVersion '${{ env.buildVersion }}' -RunNumber '${{ github.run_number }}' -SelectedProjectPathsJson $env:SELECTED_PROJECT_PATHS

    - name: Restore Packages
      run: dotnet restore

    - name: Build Projects
      run: dotnet build --configuration Release

    - name: Run Unit Tests
      if: ${{ env.runTests == 'true' }}
      run: dotnet test --configuration Release --logger trx --collect "Code coverage"

    - name: Publish Test Results
      if: ${{ env.runTests == 'true' }}
      uses: dorny/test-reporter@v3
      with:
        name: Test Results
        path: '**/*.trx'
        reporter: dotnet-trx
      continue-on-error: true

    - name: Generate Coverage Report
      if: ${{ env.runTests == 'true' }}
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.10
      with:
        reports: '**/TestResults/*/coverage.cobertura.xml'
        targetdir: 'coverage-report'
        reporttypes: 'HtmlInline;Cobertura'
      continue-on-error: true

    - name: Upload Coverage Report
      if: ${{ env.runTests == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report

    - name: NuGet login (OIDC → temp API key)
      if: ${{ github.event_name != 'pull_request' && steps.changed-packages.outputs.has_changes == 'true' }}
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: Publish NuGet Package
      if: ${{ github.event_name != 'pull_request' && steps.changed-packages.outputs.has_changes == 'true' }}
      run: ./.github/scripts/Publish-NuGetPackages.ps1 -PackageIds $env:CHANGED_PACKAGE_IDS -PackageVersion '${{ env.buildVersion }}.${{ github.run_number }}' -NuGetFeedUrl $env:NUGET_FEED_URL -NuGetApiKey $env:NUGET_API_KEY
      shell: pwsh
      env:
        NUGET_FEED_URL: ${{ env.nugetFeedUrl }}
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
        CHANGED_PACKAGE_IDS: ${{ steps.changed-packages.outputs.package_ids }}

    - name: Skip NuGet Publish
      if: ${{ steps.changed-packages.outputs.has_changes != 'true' || github.event_name == 'pull_request' }}
      run: echo "No project changes detected for NuGet publishing."

    - name: Clean Up Project Version Configuration
      if: ${{ always() }}
      shell: pwsh
      run: ./.github/scripts/Remove-ProjectVersionProps.ps1
